name: NixOS Configuration CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: nixos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    name: Flake evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Evaluate flake outputs
        run: nix flake check --no-build --print-build-logs

  declarative-tests:
    name: Declarative configuration tests
    needs: flake
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Build declarative test checks
        run: >
          nix build --no-link --print-build-logs
          .#checks.x86_64-linux.configuration
          .#checks.x86_64-linux.multi-host

  homelab-build:
    name: Build homelab system
    needs: flake
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Build production configuration
        run: >
          nix build --no-link --print-build-logs
          .#nixosConfigurations.homelab.config.system.build.toplevel

  synthetic-build:
    name: Build synthetic system
    needs: flake
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Build synthetic configuration
        run: >
          nix build --no-link --print-build-logs
          .#nixosConfigurations.synthetic.config.system.build.toplevel

  vm-test:
    name: Homelab VM integration test
    needs: flake
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Run NixOS VM integration test
        run: >
          nix build --no-link --print-build-logs
          .#checks.x86_64-linux.homelab-vm
